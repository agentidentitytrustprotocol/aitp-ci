name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bump-consume-npm-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/bump-consume-npm-lock.sh

  bump-consume-uv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A real uv makes the out-of-range case re-lock against PyPI.
      - run: curl -fsSL https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: tests/bump-consume-uv.sh
